services:
  - type: web
    name: novastream-backend
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: NOVA_LITE_MODEL_ID
        value: amazon.nova-2-lite-v1:0
      - key: NOVA_SONIC_MODEL_ID
        value: amazon.nova-2-sonic-v1:0
      - key: NOVA_MAX_SCENES_PER_EPISODE
        value: "2"
      - key: SHOWRUNNER_MAX_RETRIES
        value: "1"
      - key: SHOWRUNNER_MAX_TOKENS
        value: "400"
      - key: SUPABASE_BUCKET
        value: Episodes
      - key: SUPABASE_PATH_PREFIX
        value: episodes
      # --- Set these in the Render Dashboard (Environment tab) ---
      # AWS_ACCESS_KEY_ID
      # AWS_SECRET_ACCESS_KEY
      # PEXELS_API_KEY
      # NEWSAPI_KEY
      # SUPABASE_URL
      # SUPABASE_SERVICE_ROLE_KEY
